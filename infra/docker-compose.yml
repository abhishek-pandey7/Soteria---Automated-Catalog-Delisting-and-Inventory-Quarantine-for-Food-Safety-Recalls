# Soteria, whole system, one command:
#
#   cd infra && docker compose up -d
#
# The broker imports contracts/rabbitmq-topology.md as definitions.json on boot,
# so the exchanges, queues, dead-letter pairs and bindings exist before any
# service connects. Services still declare their own queues idempotently, which
# means a service can be deployed without an infra change and the two
# declarations must agree — infra/rabbitmq/topology_test.go checks exactly that.
#
# Everything runs against fixtures unless credentials are supplied. Nothing here
# will touch a real store or send a real email without an explicit .env.
name: soteria

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: soteria-rabbitmq
    ports:
      - "5672:5672"    # amqp
      - "15672:15672"  # management UI; credentials from infra/.env
    environment:
      # Credentials come from infra/.env; none live in the repository and there
      # is no fallback password: a stack that boots with a known password is
      # worse than one that refuses to boot. `cp infra/.env.example infra/.env`.
      #
      # A broker that imports definitions does not seed its default user, so
      # the account is declared in definitions.json with placeholders and the
      # real values are substituted at start (the file is a read-only mount;
      # the rendered copy lives in /tmp). Avoid "|" in the password.
      RABBITMQ_USER: ${RABBITMQ_USER:-soteria}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}
    command:
      - sh
      - -ec
      - |
        mkdir -p /tmp/soteria
        sed -e "s|__RABBITMQ_USER__|$${RABBITMQ_USER}|g" -e "s|__RABBITMQ_PASSWORD__|$${RABBITMQ_PASSWORD}|g"           /etc/rabbitmq/definitions.template.json > /tmp/soteria/definitions.json
        exec rabbitmq-server
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.template.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-soteria.conf:ro
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      # The topology is imported at boot; waiting for "running" alone would let
      # services connect before their bindings exist.
      # Exec form has no shell, so "&&" would be passed to rabbitmq-diagnostics
      # as an argument (and the check fails forever). check_port_connectivity
      # is the one probe that covers both: the node is running and listening.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  resolution-service:
    build:
      context: ..
      dockerfile: services/resolution-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      SHOPIFY_SHOP: ${SHOPIFY_SHOP:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
      PORT: "8081"
    ports: ["8081:8081"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  containment-service:
    build:
      context: ..
      dockerfile: services/containment-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      SHOPIFY_SHOP: ${SHOPIFY_SHOP:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
      QUARANTINE_LOCATION: ${QUARANTINE_LOCATION:-Quarantine}
      AUTO_HOLD_THRESHOLD: ${AUTO_HOLD_THRESHOLD:-0.85}
      SKU_SCOPE_THRESHOLD: ${SKU_SCOPE_THRESHOLD:-0.95}
      PORT: "8082"
    ports: ["8082:8082"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  order-rescue-service:
    build:
      context: ..
      dockerfile: services/order-rescue-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      SHOPIFY_SHOP: ${SHOPIFY_SHOP:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
      # Without this the service starts with a development secret and says so.
      CONSENT_SECRET: ${CONSENT_SECRET:-}
      PORT: "8083"
    ports: ["8083:8083"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  audit-proof-service:
    build:
      context: ..
      dockerfile: services/audit-proof-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      TSA_URL: ${TSA_URL:-http://timestamp.digicert.com}
      TSA_DISABLED: ${TSA_DISABLED:-}
      PORT: "8085"
    ports: ["8085:8085"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ---- Person 1: detection, extraction, notification, anti-evasion ----------
  #
  # Nothing here sends anything unless credentials are supplied: the extractor
  # and the evasion judge fall back to deterministic fakes without GROQ_API_KEY,
  # and notification logs instead of posting without SLACK_WEBHOOK_URL /
  # RESEND_API_KEY. ingestion-fda does poll openFDA and the FDA press feed for
  # real (keyless, well inside their limits); every notice it publishes flows
  # into resolution.recall-raw and extractor.recall-raw.

  ingestion-fda:
    build:
      context: ..
      dockerfile: services/ingestion-fda/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-14}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-ops@soteria.dev}
      HTTP_ADDR: ":8091"
    ports: ["8091:8091"]
    volumes:
      - fda-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  recall-extractor:
    build:
      context: ..
      dockerfile: services/recall-extractor/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      # Without a key the extractor runs its deterministic fake and says so.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      PORT: "8086"
    ports: ["8086:8086"]
    volumes:
      - extractor-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      # Unset = log channel only. Nothing leaves the box without these.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RETAILER_NAME: ${RETAILER_NAME:-}
      RESCUE_CONSENT_URL: ${RESCUE_CONSENT_URL:-http://localhost:5173/orders?rescue={rescue_id}}
      PORT: "8084"
    ports: ["8084:8084"]
    volumes:
      - notification-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ingestion-silent-diff:
    build:
      context: ..
      dockerfile: services/ingestion-silent-diff/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      POLL_INTERVAL_SECONDS: ${SILENT_DIFF_INTERVAL:-3600}
      # 8085 is audit on the host; the container keeps its default and is
      # published on 8088.
      PORT: "8085"
    ports: ["8088:8085"]
    volumes:
      - silent-diff-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  anti-evasion-service:
    build:
      context: ..
      dockerfile: services/anti-evasion-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-soteria}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in infra/.env}@rabbitmq:5672/
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      POLL_INTERVAL_SECONDS: ${EVASION_INTERVAL:-3600}
      PORT: "8087"
    ports: ["8087:8087"]
    volumes:
      - evasion-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbit-data:
  fda-data:
  extractor-data:
  notification-data:
  silent-diff-data:
  evasion-data:

# Import the topology at boot so exchanges, queues, dead-letter pairs and
# bindings exist before any service connects. Services still declare their own
# queues idempotently; the two declarations must agree, which topology_test.go
# checks against contracts/rabbitmq-topology.md. The file is rendered from
# definitions.json at container start with the service account filled in.
load_definitions = /tmp/soteria/definitions.json

# A consumer that stops acking must not grow the queue without bound: the audit
# ledger's completeness guarantee depends on dead-lettering, not on dropping.
consumer_timeout = 1800000

# Refuse publishes before the disk fills, rather than losing events silently.
disk_free_limit.absolute = 500MB
vm_memory_high_watermark.relative = 0.6

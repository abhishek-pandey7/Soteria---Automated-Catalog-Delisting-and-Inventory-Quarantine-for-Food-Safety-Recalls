# CI for Person 1's ingestion services. Person 3 owns the shared CI/CD
# templates (PRD §7 P3.C); this job is scoped to these folders so it can be
# folded into those templates later without touching other services.
name: ingestion

on:
  push:
    paths: ["go.work", "libs/**", "services/ingestion-*/**", "services/notification-service/**", "services/ingestion-silent-diff/**", "services/recall-extractor/**", "services/anti-evasion-service/**", "contracts/**", ".github/workflows/ingestion.yml"]
  pull_request:
    paths: ["go.work", "libs/**", "services/ingestion-*/**", "services/notification-service/**", "services/ingestion-silent-diff/**", "services/recall-extractor/**", "services/anti-evasion-service/**", "contracts/**", ".github/workflows/ingestion.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [libs/feedkit, libs/shopify, tools/democtl, services/ingestion-fda, services/ingestion-usda, services/ingestion-rasff, services/notification-service, services/recall-extractor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l ${{ matrix.module }})" || (gofmt -l ${{ matrix.module }}; exit 1)
      - name: vet + test (includes contract tests against /contracts)
        working-directory: ${{ matrix.module }}
        run: go vet ./... && go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingestion-silent-diff/requirements-dev.txt
      - name: test ingestion-silent-diff (includes contract validation)
        working-directory: services/ingestion-silent-diff
        run: pip install -r requirements-dev.txt && python -m pytest -q
      - name: test anti-evasion-service (includes contract validation)
        working-directory: services/anti-evasion-service
        run: pip install -r requirements-dev.txt && python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [test, python]
    strategy:
      matrix:
        svc: [ingestion-fda, ingestion-usda, ingestion-rasff, notification-service, ingestion-silent-diff, recall-extractor, anti-evasion-service]
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f services/${{ matrix.svc }}/Dockerfile -t soteria/${{ matrix.svc }}:ci .
